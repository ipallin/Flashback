[flake8]
max-line-length = 100
# E221/E127: alineación intencional de asignaciones y continuaciones para
#   legibilidad de tablas de constantes y mapas de traducción.
# E501: literales que emiten código C no pueden partirse sin alterar la salida.
# E203/W503: incompatibles con el formateo por bloques.
# F541: f-strings usadas por homogeneidad en secuencias de emisión de C.
extend-ignore = E203, E221, E127, E272, E501, E741, W503, F541
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist,
    tests/corpus/build,
    tests/corpus/src
# flake8-bugbear: comprobaciones adicionales de errores probables (RD04)
extend-select = B
